<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 1</title>
</head>
<body>

    <form action="/action">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

        <label for="sex">Sex:</label>
        <input type="radio" id="sex" name="sex" value="male">
        <label for="sex">Male</label>
        <input type="radio" id="sex" name="sex" value="female">
        <label for="sex">Female</label><br><br>

        <label for="country">Country:</label>
        <select name="country" id="country">
            <option value="">Select an option</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="nepal">Nepal</option>
            <option value="uk">UK</option>
        </select><br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" id="message"  placeholder="Enter your message">
        </textarea><br><br>

        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe ?</label><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
